[build]
  command = "npm run build"
  publish = "dist"

# HTTPS → HTTP API (mixed content) 우회
[[redirects]]
  from = "/auth/*"
  to = "http://3.27.238.246:8080/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/kakao/login"
  to = "http://3.27.238.246:8080/oauth/kakao/login"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "http://3.27.238.246:8080/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/users/*"
  to = "http://3.27.238.246:8080/users/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tests/*"
  to = "http://3.27.238.246:8080/tests/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/results/*"
  to = "http://3.27.238.246:8080/results/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/missions/sprout/*"
  to = "http://3.27.238.246:8080/missions/sprout/:splat"
  status = 200
  force = true

# GET /home API (화면은 React /app — public/_redirects와 동일)
[[redirects]]
  from = "/home"
  to = "http://3.27.238.246:8080/home"
  status = 200
  force = true

# 카카오 OAuth 프론트 콜백 (쿼리스트링 유지)
[[redirects]]
  from = "/oauth/kakao/callback"
  to = "/index.html"
  status = 200

# React Router SPA (직접 URL·새로고침·공유 링크)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
